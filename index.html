<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05090a">
<title>滅蚊達人｜第 3 關 巡倒清刷</title>
<style>
  html,body{margin:0;height:100%;background:#05090a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100%;max-height:100%;aspect-ratio:16/9;object-fit:contain}
  @media (min-aspect-ratio:16/9){canvas{width:auto;height:100%}}
  #rot{display:none;position:fixed;inset:0;background:#05090a;color:#f2e8cc;font:700 22px "Microsoft JhengHei","PingFang TC",sans-serif;align-items:center;justify-content:center;text-align:center;z-index:9}
  @media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
</style></head>
<body><div id="rot">📱 請把手機轉成橫的<br>再開始玩 🔄</div><div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<audio id="bgm" src="audio/bgm.mp3" loop preload="auto"></audio>
<script src="game.js"></script>
</body></html>
